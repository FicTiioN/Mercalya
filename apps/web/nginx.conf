# Serve o build do Vite como SPA: rota desconhecida devolve o index.html e o
# React Router decide a tela. Porta 8080 para nao exigir root.
#
# Atencao: no nginx, um `add_header` dentro de `location` ANULA os do `server`.
# Por isso os cabecalhos de seguranca se repetem em cada bloco.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Arquivos com hash no nome nunca mudam: cache de um ano.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # O index.html muda a cada deploy: sempre revalidar, senao o navegador
  # pede bundles que ja nao existem.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
  }
}
